<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gram Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="hdr-l"><button class="back" id="back" hidden aria-label="Back">←</button><div class="logo">Gram <b>Legends</b></div></div>
    <div class="hdr-r"><div class="coins gems" id="gems">💎 <span>0</span></div><div class="coins" id="coins">🪙 <span>0</span></div><button class="gear" id="settings" aria-label="Settings">⚙️</button></div>
  </header>
  <main id="screen"></main>
  <nav id="nav">
    <button data-tab="map" class="active"><span>🗺️</span>Map</button>
    <button data-tab="arena"><span>⚔️</span>Arena</button>
    <button data-tab="heroes"><span>🃏</span>Heroes</button>
    <button data-tab="chest"><span>🎁</span>Chests</button>
    <button data-tab="quests"><span>📜</span>Quests</button>
    <button data-tab="rank"><span>🚩</span>Community</button>
  </nav>
</div>
<div id="battle" hidden></div>
<div id="modal" hidden><div class="modal-wrap"><button class="m-close" id="m-close" aria-label="Close">✕</button><div class="modal-box"></div></div></div>
<script>window.TL_CONFIG = { api: '' }; // backend URL ('' = same server that serves the game)</script>
<script src="audio.js"></script>
<script src="online.js"></script>
<script src="fusions-data.js"></script>
<script src="engine.js"></script>
<script src="scene.js"></script>
<script src="i18n.js"></script>
<script src="i18n-world.js"></script>
<script src="i18n-social.js"></script>
<script src="i18n-review.js"></script>
<script src="i18n-play.js"></script>
<script src="i18n-story.js"></script>
<script src="economy.js"></script>
<script src="game.js"></script>
<script src="battle-fx.js"></script>
<script src="meta.js"></script>
<script src="clans.js"></script>
<script src="war.js"></script>
<script src="pass.js"></script>
<script src="extras.js"></script>
<script src="arena.js"></script>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.initTelegram && initTelegram()" onerror="Online.markReady()"></script>
</body>
</html>
