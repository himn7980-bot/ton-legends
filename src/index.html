<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TON Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">TON <b>Legends</b></div>
    <div class="hdr-r"><div class="coins" id="coins">🪙 <span>0</span></div><button class="gear" id="settings" aria-label="تنظیمات">⚙️</button></div>
  </header>
  <main id="screen"></main>
  <nav id="nav">
    <button data-tab="map" class="active"><span>🗺️</span>نقشه</button>
    <button data-tab="heroes"><span>🃏</span>قهرمان‌ها</button>
    <button data-tab="chest"><span>🎁</span>صندوق</button>
    <button data-tab="quests"><span>📜</span>ماموریت</button>
    <button data-tab="rank"><span>🏆</span>رتبه‌ها</button>
  </nav>
</div>
<div id="battle" hidden></div>
<div id="modal" hidden><div class="modal-box"></div></div>
<script>window.TL_CONFIG = { api: '' }; // backend URL ('' = same server that serves the game)</script>
<script src="audio.js"></script>
<script src="online.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
<script src="meta.js"></script>
<script async src="https://telegram.org/js/telegram-web-app.js" onload="window.initTelegram && initTelegram()"></script>
</body>
</html>
