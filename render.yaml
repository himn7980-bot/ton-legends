# One-click deploy on Render.com (Blueprint). Set BOT_TOKEN and WEBAPP_URL in the dashboard.
services:
  - type: web
    name: ton-legends
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      # Partner Pool: after an official agreement with a community's project, BUYBACK_PCT% of the net revenue
      # (FUND_NET_PCT% of the Stars, after store/Telegram fees) from that community's purchases goes into its pool
      - key: BUYBACK_PCT
        value: "40"
      - key: FUND_NET_PCT
        value: "70"
      - key: FUND_WALLET
        sync: false
      # Rewarded ads (Adsgram): block id, and the secret used in the reward URL set in the Adsgram dashboard:
      #   https://<your-app>/api/ads/reward?userid=[userId]&secret=<ADS_SECRET>
      - key: ADSGRAM_BLOCK_ID
        sync: false
      - key: ADS_SECRET
        sync: false
      # The game's own channel (@name). New players must join it first (welcome reward). The bot must be an admin there.
      - key: GAME_CHANNEL
        value: "@gramlegends_game"
      # Heap size: ~400 on Starter (512 MB), ~1536 on Standard (2 GB)
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # Save the database at most every N ms (whole-file JSON writes)
      - key: SAVE_MS
        value: "3000"
      # Market mood: hero=coingecko-id:SYMBOL for heroes whose token price sets their mood/dip bonus (others use community activity)
      - key: MARKET_TOKENS
        value: notcoin=notcoin:NOT,dog=dogs-2:DOGS
      # Fusion art generation (/gen in the bot): API key from dev.runwayml.com
      - key: RUNWAYML_API_SECRET
        sync: false
